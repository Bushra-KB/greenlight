# Shared Docker network: hostnames `postgres` and `redis` resolve here.
# Create once if missing: sudo docker network create akademio-gl-net
# If DB/Redis already run elsewhere, attach them: sudo docker network connect akademio-gl-net postgres
#   and same for redis.

networks:
  akademio-gl:
    name: akademio-gl-net
    external: true

services:
  postgres:
    image: postgres:14-alpine3.20
    container_name: postgres
    restart: unless-stopped
    volumes:
      - ./data/postgres/14/database_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=
    networks:
      - akademio-gl

  redis:
    image: redis:6.2-alpine3.20
    container_name: redis
    restart: unless-stopped
    volumes:
      - ./data/redis/database_data:/data
    networks:
      - akademio-gl

  greenlight-v3:
    entrypoint: [bin/start]
    build:
      context: .
      dockerfile: Dockerfile
    image: akademio-greenlight:fork
    container_name: greenlight-v3
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - 127.0.0.1:5050:3000
    logging:
      driver: journald
    volumes:
      - ./data/greenlight-v3/storage:/usr/src/app/storage
    depends_on:
      - postgres
      - redis
    networks:
      - akademio-gl
